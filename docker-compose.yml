services:
  backend:
    build: ./backend
    ports:
      # only this machine can reach the API (the UI calls http://127.0.0.1:8000)
      - "127.0.0.1:8000:8000"
    volumes:
      - local_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status != 200)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  local_storage:
